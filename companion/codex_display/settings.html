<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex 屏幕 · 设置</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#080d0b;color:#f5f8f6}*{box-sizing:border-box}body{max-width:560px;margin:0 auto;padding:44px 24px}small,.help{color:#b5c9bd}h1{font-size:30px;letter-spacing:-1px;margin:10px 0 12px}p{line-height:1.7}.tag{font-size:13px;letter-spacing:2px;color:#62d7a0}.preview{border:1px solid #304a3e;border-radius:32px;background:#050807;margin:28px auto;padding:24px;width:272px;height:272px}.top{display:flex;justify-content:space-between;align-items:center;font-size:14px}.name{max-width:160px;overflow:hidden;white-space:nowrap;font-weight:700}.power{color:#62d7a0}.ring{margin:34px auto 14px;width:52px;height:52px;border:3px solid #1b3853;border-top-color:#9b87ff;border-right-color:#61e8f5;border-radius:50%;animation:spin 1.8s linear infinite}.status{text-align:center;font-size:23px;font-weight:700}.sub{text-align:center;font-size:13px;color:#b5c9bd;margin:7px 0}label{display:block;font-weight:650;margin:30px 0 10px}input,button{width:100%;font:inherit;padding:15px;border-radius:12px}input{background:#122019;color:inherit;border:1px solid #496253;font-size:20px}input:focus-visible{outline:2px solid #62d7a0;outline-offset:3px}button{margin-top:18px;background:#62d7a0;color:#08130d;border:0;font-weight:700;cursor:pointer}.help{font-size:14px;margin:10px 0}#message{min-height:24px;color:#62d7a0;margin-top:14px}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.ring{animation:none}}
</style>
<div class="tag">局域网 · 屏幕设置</div><h1>给你的状态屏起个名字</h1><p class="help">修改左上角文字，保存后约 2 秒同步到开发板。</p>
<div class="preview" aria-label="文字位置示意"><div class="top"><span class="name" id="preview">__LABEL__</span><span class="power">ϟ 74%</span></div><div class="ring"></div><div class="status">正在执行</div><p class="sub">界面位置示意</p></div>
<form id="form"><label for="name">左上角文字</label><input id="name" name="header_text" value="__LABEL__" maxlength="16" required autocomplete="off"><p class="help">支持中文和英文。最多约 8 个汉字；实际长度以屏幕可用宽度为准。</p><button id="save">保存到屏幕</button><p id="message" role="status" aria-live="polite"></p></form>
<p class="help">文字保存在这台电脑，重启后保留。亮度与音量请长按设备屏幕调节。</p>
<script>
const input=document.getElementById('name'),message=document.getElementById('message'),button=document.getElementById('save');
input.addEventListener('input',()=>document.getElementById('preview').textContent=input.value);
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;message.textContent='正在保存…';try{const r=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':'__TOKEN__'},body:JSON.stringify({header_text:input.value})});const j=await r.json();if(!r.ok)throw Error(j.error||'保存失败');input.value=j.header_text;document.getElementById('preview').textContent=j.header_text;message.style.color='#62d7a0';message.textContent='已保存，屏幕即将更新。';}catch(error){message.style.color='#ffce61';message.textContent=error.message;}finally{button.disabled=false;}});
</script></html>
